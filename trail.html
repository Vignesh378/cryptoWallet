<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .slider{
        
            width: 80%;
            border: 1px solid red;
            height: var(--height);
            overflow: hidden;
            mask-image: linear-gradient( 
                to right,
                transparent,
                #000 10% 90%,
                transparent
            );
           
        }
        .slider .list{
            display: flex;
            width: 100%;
            min-width: calc(var(--width)*var(--quantity));
            position: relative;
        }
        .slider .list .item{
            width: var(--width);
            height: var(--height);
position: absolute;
 left: 100%;
 animation: autoRun 10s linear infinite;
 animation-delay:calc((10s/var(--quantity))*var(--position));
          

        }
        .slider .list .item h1{
            width: 100%;
        }
        @keyframes autoRun{
          from{
            left:100%;
          }
          to{
            left:calc(var(--width)*-1)
          }
        }
        .slider:hover .item{
            animation-play-state:paused!important;
            
        }
    </style>
</head>
<body>
    <div class="slider" style="--width:100px; --height:50px; --quantity:10">
        <div class="list">
            <div class="item"style="--position:1"><h1>bybit</h1></div>
            <div class="item"style="--position:2"><h1>blockstash</h1></div>
            <div class="item"style="--position:3"><h1>hello</h1></div>
            <div class="item"style="--position:4"><h1>world</h1></div>
            <div class="item"style="--position:5"><h1>yeo</h1></div>
            <div class="item"style="--position:6"><h1>v</h1></div>
            <div class="item"style="--position:7"><h1>varsache</h1></div>
            <div class="item"style="--position:8"><h1>news</h1></div>
            <div class="item"style="--position:9"><h1>yours</h1></div>
            <div class="item"style="--position:10"><h1>Rolex</h1></div>
        </div>
    </div>
</body>
</html>
