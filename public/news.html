    <style>
        html, body {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
 height: 100%;
 /*  */
}


body{
    background:#0f1923;
}
header {
 
 padding: 0px 0;
 margin: 0px;
 width: 100%;
 position: fixed; /* Make the header fixed */
 top: 0; /* Position it at the top of the viewport */
 z-index: 1000; /* Make sure it stays on top */  
 animation: navanima linear;
 animation-timeline: scroll();
 
}
nav {
display: grid;
grid-template-columns: 1fr 3fr 1fr;
align-items: center;
max-width: 95%;
 margin: 0 auto;
 padding: 0 20px;
color: rgb(255, 255, 255);


}
.logo a {
 font-family: 'Circular Std', sans-serif;
 font-weight: 700;

 margin: 0;
 cursor: pointer;
 text-decoration: none;
 color: white;
 font-size: 30px;
}
.logo a span{
 color: red;
}
.nav-links {
 padding-right: 0px;
 list-style: none;
 display: flex;
 align-items: center;
 gap: 20px;
}
.nav-links  li>a {
 text-decoration: none;
  font-size:16px ;
  font-family: "Barlow", sans-serif;
  font-weight: 600;
  font-style: normal;
  color: white;
 
}

.nav-links li:hover{
 color:rgb(51, 51, 196);
 transition: 0.3s;
 cursor: pointer;
}
.create-btn {
 position: relative; /* Allows positioning of pseudo-elements */
 display: inline-block;

 overflow: hidden; /* Ensures content doesn't overflow the button */


}

.create-btn a {
font-size: 20px;
 
  font-family: "Afacad Flux", serif;
  font-weight: 600;
  
text-decoration: none;
 color:black;
 align-items: center;
 position: relative;
display: inline-block;

 

 background-color: white;
 border-radius: 25px;
align-content: center;
padding: 10px 30px;

 transition: transform 0.3s ease; /* Smooth transition for movement */
 position: relative;
 z-index: 1; /* Keeps the anchor tag above the pseudo-element */
 
}
.create-btn a:hover{
 background: rgb(51, 51, 196);
 color:white;
 transition: 0.5s;
}
/* ----------------------main-container-------------------- */

  }
  20%,100%{

    <script>
       document.querySelectorAll('header nav .nav-links a').forEach(link => {
  link.addEventListener('click', (event) => {
    event.preventDefault();
    const href = link.getAttribute('href'); // use 'link', not 'event.target'
    
    if (!href) {
      console.error('No href found on link');
      return;
    }

    fetch(href, {
      method: 'GET',
      redirect: 'follow',
    })
      .then((response) => {
        if (response.ok) {
          window.location.href = href;
        } else {
          console.error('Failed to fetch the signup page');
        }
      })
      .catch((err) => {
        console.error('Error:', err);
      });
  });
});

    </script>
